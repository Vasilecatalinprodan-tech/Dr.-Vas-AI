name: Dr.Vas browser regression tests

on:
  pull_request:
    branches: [drvas-integrated-platform, main]
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [main, universal-chat-attachments, feature/presenter-assets-animation-2026-11-06]
    paths:
      - 'www/**'
      - 'tests/e2e/**'
      - 'worker/**'
      - 'supabase/migrations/**'
      - '.github/workflows/browser-e2e.yml'

permissions:
  contents: read

concurrency:
  group: drvas-browser-e2e-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker, inline browser JavaScript and attachment migration
        run: |
          node --check worker/index.js
          node --check www/crypto-engine.js
          node --check www/module-workspaces.js
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(script => script.trim());
          if (!scripts.length) throw new Error('No inline browser script found');
          scripts.forEach((script, index) => new vm.Script(script, { filename: `drvas-inline-${index}.js` }));
          const migration = fs.readFileSync('supabase/migrations/202611050001_chat_attachments.sql', 'utf8');
          for (const marker of [
            'create table if not exists public.drvas_chat_attachments',
            'enable row level security',
            'auth.uid() = user_id',
            "'health_data_processing'",
            "'file_processing'"
          ]) {
            if (!migration.toLowerCase().includes(marker.toLowerCase())) throw new Error('Attachment migration missing: ' + marker);
          }
          const worker = fs.readFileSync('worker/index.js', 'utf8');
          for (const marker of [
            'file_processing_consent_get',
            'file_processing_consent',
            'health_data_processing',
            'granted: body.granted',
            'revoked: body.granted === false'
          ]) {
            if (!worker.includes(marker)) throw new Error('File consent Worker route missing: ' + marker);
          }
          const userFacingSource = html + '\\n' + worker;
          for (const pattern of [
            /(?:Aplică|Apply|Applica|Wende|Appliquez|Aplica|Примените).{0,100}(?:migra|migration)/i,
            /(?:Verifică|Check|Controlla).{0,100}(?:migra|migration)/i
          ]) {
            if (pattern.test(userFacingSource)) throw new Error('User-facing migration instructions are forbidden; direct users to administrator review instead.');
          }
          console.log(`Validated Worker, ${scripts.length} inline script(s), private attachment migration, consent withdrawal routes and migration-safe user error guidance.`);
          NODE

      - name: Verify production Worker deployment never applies database migrations
        run: |
          node <<'NODE'
          const fs = require('fs');
          const workflow = fs.readFileSync('.github/workflows/deploy-worker.yml', 'utf8');
          const android = fs.readFileSync('.github/workflows/android.yml', 'utf8');
          const deploy = workflow.indexOf('Deploy Worker');
          if (deploy < 0) throw new Error('Cloudflare Worker deployment step is missing.');
          for (const marker of ['supabase db push', 'supabase migration repair', 'SUPABASE_DB_URL', 'SUPABASE_ACCESS_TOKEN']) {
            if (workflow.includes(marker)) throw new Error('Automatic database mutation/access is forbidden in the Worker release workflow: ' + marker);
          }
          if (!workflow.includes('Database migrations are deliberately excluded from automatic Worker releases.')) {
            throw new Error('The database migration safety boundary must be documented in the release workflow.');
          }
          const triggerBlock = android.split('\nconcurrency:')[0].split('\non:')[1] || '';
          if (!triggerBlock.includes('workflow_dispatch:') || /(^|\n)\s{2}(push|pull_request|schedule|workflow_run|repository_dispatch):/.test(triggerBlock)) {
            throw new Error('Android APK workflow must be manual-only until the founder explicitly resumes packaging.');
          }
          if (!android.includes('node --check www/module-workspaces.js') || !android.includes('./gradlew assembleDebug') || !android.includes('name: DrVas-APK')) {
            throw new Error('Final Android APK workflow must validate module workspaces and upload the APK artifact.');
          }
          console.log('Verified: Worker releases do not access or mutate Supabase; APK builds remain workflow_dispatch-only.');
          NODE

      - name: Install browser test runner
        run: npm install --no-save --package-lock=false --save-exact @playwright/test@1.64.1 playwright-core@1.64.1

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.64.1

      - name: Install Chromium
        # GitHub-hosted Ubuntu runners already provide the browser system libraries.
        # Cache the pinned Playwright headless shell instead of running apt on every PR.
        run: npx playwright install --only-shell chromium

      - name: Start local static site
        run: |
          python3 -m http.server 4173 --directory www > /tmp/drvas-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/drvas-http.log
          exit 1

      - name: Run homepage and session-restoration tests
        run: npx playwright test tests/e2e/homepage.spec.cjs tests/e2e/data-isolation-migrations.spec.cjs tests/e2e/module-persistence.spec.cjs tests/e2e/academy-progress.spec.cjs tests/e2e/studio-station-persistence.spec.cjs tests/e2e/income-tracker.spec.cjs tests/e2e/crypto-engine.spec.cjs --reporter=line
