name: Import presenter portraits
on:
  push:
    branches:
      - feature/presenter-faces-2026-11-06
    paths:
      - .github/workflows/import-presenter-assets.yml
permissions:
  contents: write
jobs:
  import-presenter-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/presenter-faces-2026-11-06
          fetch-depth: 0
      - name: Download generated portraits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www/assets/presenters
          curl --fail --location --silent --show-error \
            'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/d3842309-f86b-4f5e-991f-0698b3573c08/069e0e85-01ec-45bd-a1d2-c300fd1ee75d/A_single_standalone_photorealistic_head_and_shoulders_portra.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTlkN2Q2Y2U4Yzg1MjM4MiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NDExNjQzMH0.eTIoOeeFTJoq-vgxlIOBJ8UBjDlF2ypeBEgtdscrwq0' \
            -o www/assets/presenters/jan.jpg
          curl --fail --location --silent --show-error \
            'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-lite-image/images/122ba613-ef40-4b59-99e7-7903cca5b905/bbce3dfd-1bc2-427a-bbff-1545d1261b0a/Edit_the_supplied_reference_photograph_into_a_single_standal.jpg?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJraWQiOiJydW53YXktdGFzay1hcnRpZmFjdHMiLCJzdGFnZSI6InByb2QiLCJleHAiOjE3OTQxMzE5MTd9.5B5nEjXcHcuFP81vsxplLZjTysT-z2EJHyd-IBDEZ-Y' \
            -o www/assets/presenters/sarah.jpg
          file www/assets/presenters/*.jpg
          test "$(file --brief --mime-type www/assets/presenters/jan.jpg)" = "image/jpeg"
          test "$(file --brief --mime-type www/assets/presenters/sarah.jpg)" = "image/jpeg"
          test "$(wc -c < www/assets/presenters/jan.jpg)" -gt 10000
          test "$(wc -c < www/assets/presenters/sarah.jpg)" -gt 10000
      - name: Commit portrait assets to feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/assets/presenters/jan.jpg www/assets/presenters/sarah.jpg
          git commit -m "assets: add Dr.Jan and Sarah presenter portraits"
          git push origin HEAD:feature/presenter-faces-2026-11-06
