name: Deploy Dr.Vas Worker

on:
  workflow_dispatch:
  push:
    branches:
      - drvas-integrated-platform

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: drvas-integrated-platform

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Worker and browser JavaScript
        run: |
          node --check worker/index.js
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)]
            .map(match => match[1])
            .filter(script => script.trim());
          if (!scripts.length) throw new Error('No inline browser script found');
          scripts.forEach((script, index) => new vm.Script(script, { filename: `drvas-inline-${index}.js` }));
          console.log(`Validated ${scripts.length} inline browser script(s).`);
          NODE

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
