name: Build DrVas APK

on:
  workflow_dispatch:
  push:
    branches:
      - drvas-integrated-platform
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

concurrency:
  group: drvas-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Prepare app
        run: |
          test -f www/index.html
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish public Android APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Dr.Vas Android — latest test build
          body: |
            Latest automatically built Dr.Vas Android APK.
            This is a debug/test build, not a Google Play production release.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: DrVas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk