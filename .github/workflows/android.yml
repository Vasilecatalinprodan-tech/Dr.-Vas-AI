name: Build DrVas APK

# APK builds are intentionally manual-only until the web platform is stable
# and the founder explicitly asks to resume Android packaging.
on:
  workflow_dispatch:

concurrency:
  group: drvas-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Prepare app
        run: |
          test -f www/index.html
          node --check www/module-workspaces.js
          npx cap sync android

      - name: Check Android privacy defaults
        run: |
          grep -F 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -F 'setMediaPlaybackRequiresUserGesture(false)' android/app/src/main/java/com/drvas/ai/MainActivity.java

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify APK and calculate checksum
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DrVas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30