name: Build DrVas APK

# Build a fresh debug APK automatically whenever merged web/app assets change.
# Manual dispatch remains available for an owner-requested rebuild.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

concurrency:
  group: drvas-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Prepare app
        run: |
          test -f www/index.html
          npx cap sync android

      - name: Check Android privacy defaults
        run: |
          grep -F 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -F 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -F 'setMediaPlaybackRequiresUserGesture(false)' android/app/src/main/java/com/drvas/ai/MainActivity.java

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DrVas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk